name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/server exec prisma generate --schema=prisma/schema.prisma
      - run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/server exec prisma generate --schema=prisma/schema.prisma
      - run: pnpm run test

  ca-service:
    # services/ca is deliberately not a pnpm workspace package (separate
    # deployable, per TASKS.md / CA_SERVICE_SPEC.md) so it builds/tests on
    # its own npm-managed toolchain here instead of the pnpm jobs above.
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/ca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/ca/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test
