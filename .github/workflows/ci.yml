name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/server exec prisma generate --schema=prisma/schema.prisma
      - run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/server exec prisma generate --schema=prisma/schema.prisma
      # @pwm/server and @pwm/mobile both import @pwm/core by its built
      # dist/ output (package.json main/exports point there, not src/) --
      # this job is a separate runner from the build job, so nothing
      # carries over; core must be built here too before running tests
      # that import it.
      - run: pnpm --filter @pwm/core run build
      - run: pnpm run test

  ca-service:
    # services/ca is deliberately not a pnpm workspace package (separate
    # deployable, per TASKS.md / CA_SERVICE_SPEC.md) so it builds/tests on
    # its own npm-managed toolchain here instead of the pnpm jobs above.
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: services/ca
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ca/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test
