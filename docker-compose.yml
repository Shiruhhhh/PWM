# pwm-app deployment per docs/DEPLOY.md: caddy + node-app + postgres.
# Manual `docker compose pull && docker compose up -d` deploy, per spec.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '443:443'
      - '8443:8443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/pwm-app-cert/ca.crt:/etc/pwm/ca.crt:ro
      - /etc/pwm-app-cert/bootstrap-server.crt:/etc/pwm/bootstrap-server.crt:ro
      - /etc/pwm-app-cert/bootstrap-server.key:/etc/pwm/bootstrap-server.key:ro
      - /var/log/caddy:/var/log/caddy
    environment:
      - PWM_PUBLIC_HOST=${PWM_PUBLIC_HOST}
    depends_on:
      - node-app

  node-app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-shiruhhhh}/pwm-app:${PWM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENUMERATION_HMAC_SECRET=${ENUMERATION_HMAC_SECRET}
      - CA_SERVICE_URL=${CA_SERVICE_URL}
      - CA_CLIENT_CERT_PATH=/etc/pwm-app-cert/pwm-app-client.crt
      - CA_CLIENT_KEY_PATH=/etc/pwm-app-cert/pwm-app-client.key
      - CA_TRUST_CERT_PATH=/etc/pwm-app-cert/ca.crt
      - PORT=3000
    volumes:
      - /etc/pwm-app-cert:/etc/pwm-app-cert:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pwm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=pwm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pwm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
