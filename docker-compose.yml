# pwm-app deployment per docs/DEPLOY.md: node-app + postgres only.
# Caddy (TLS termination, both listeners) moved to pwm-proxy (CT 200) --
# see infra/caddy/docker-compose.yml and docs/DECISIONS.md's
# reverse-proxy migration entry. Manual `docker compose pull && docker
# compose up -d` deploy, per spec.

services:
  node-app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-shiruhhhh}/pwm-app:${PWM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ENUMERATION_HMAC_SECRET=${ENUMERATION_HMAC_SECRET}
      - CA_SERVICE_URL=${CA_SERVICE_URL}
      - CA_CLIENT_CERT_PATH=/etc/pwm-app-cert/pwm-app-client.crt
      - CA_CLIENT_KEY_PATH=/etc/pwm-app-cert/pwm-app-client.key
      - CA_TRUST_CERT_PATH=/etc/pwm-app-cert/ca.crt
      - PORT=3000
      - APP_RELEASES_DIR=/etc/pwm-app-releases
    volumes:
      - /etc/pwm-app-cert:/etc/pwm-app-cert:ro
      # scripts/deploy-apk.sh writes here from the host side; node-app
      # only ever reads (GET /app/version, GET /app/apk) -- read-only.
      - /etc/pwm-app-releases:/etc/pwm-app-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to the host (not just `expose`) so pwm-proxy (CT 200) can
    # reach it over the LAN -- Caddy no longer runs in this compose
    # project's own Docker network. Firewalled to accept only from CT
    # 200's IP (see docs/PROXMOX_NETWORK.md) -- this port is NOT meant
    # to be reachable from the rest of the LAN.
    ports:
      - '3000:3000'

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pwm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=pwm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pwm']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
