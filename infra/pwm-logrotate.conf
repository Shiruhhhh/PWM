# PWM — log rotation, per docs/MONITORING.md "Log retention".
# Install on pwm-app: copy to /etc/logrotate.d/pwm
#
# pino (pwm-app's node-app) and Caddy both log to stdout inside their
# containers by default -- this rotates the files docker's json-file log
# driver writes to disk, plus Caddy's own access-log files (configured in
# infra/Caddyfile to write to /var/log/caddy/ via a host bind mount, not
# docker's log driver).

/var/log/caddy/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
}

# docker's own json-file driver log location for the compose stack's
# containers -- adjust the glob if COMPOSE_DIR differs from /opt/pwm.
/var/lib/docker/containers/*/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
}
